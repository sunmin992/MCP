<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시나리오 확인</title>
<style>
  :root { --line:#d8d8d8; --muted:#666; --warn:#a4501a; --ok:#1d6b3a; }
  body { font:15px/1.6 system-ui, "Malgun Gothic", sans-serif; margin:0; color:#181818; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { display:flex; gap:0; align-items:stretch; min-height:calc(100vh - 62px); }
  #list { width:280px; border-right:1px solid var(--line); overflow:auto; }
  #list button { display:block; width:100%; text-align:left; padding:10px 14px; border:0;
                 border-bottom:1px solid #eee; background:#fff; cursor:pointer; font:inherit; }
  #list button[aria-current="true"] { background:#eef3fb; }
  #detail { flex:1; padding:18px 22px; overflow:auto; }
  .state { font-size:12px; padding:1px 7px; border:1px solid var(--line); border-radius:9px; }
  .UNCONFIRMED { color:var(--warn); border-color:var(--warn); }
  .CONFIRMED   { color:var(--ok);   border-color:var(--ok); }
  .EXECUTED    { color:var(--muted); }
  table { border-collapse:collapse; margin:10px 0 18px; }
  th, td { border:1px solid var(--line); padding:5px 10px; text-align:left; font-size:14px; }
  th { background:#fafafa; font-weight:600; }
  .warn { border-left:3px solid var(--warn); background:#fdf6f0; padding:9px 12px; margin:12px 0; }
  .approved { border-left:3px solid var(--line); background:#f6f6f6; padding:9px 12px; margin:12px 0; }
  .ask { border-left:3px solid #3a6ea5; background:#f2f6fb; padding:9px 12px; margin:12px 0; }
  .ask p { margin:4px 0 0; }
  td code, th code { font-size:12px; color:var(--muted); background:none; padding:0; }
  #exposure { display:none; background:#a4501a; color:#fff; padding:8px 20px; font-size:13px; }
  #exposure.on { display:block; }
  button.go { padding:9px 18px; font:inherit; cursor:pointer; border:1px solid #333;
              background:#222; color:#fff; border-radius:3px; }
  button.go[disabled] { background:#e6e6e6; color:#888; border-color:var(--line); cursor:default; }
  code { background:#f4f4f4; padding:1px 5px; border-radius:3px; font-size:13px; }
  .empty { color:var(--muted); padding:20px; }
  .scroll { overflow-x:auto; }
  @media (max-width:720px) {
    main { display:block; }
    #list { width:auto; max-height:34vh; border-right:0; border-bottom:1px solid var(--line); }
    #detail { padding:14px 16px; }
    /* 표가 화면보다 넓으면 표만 가로로 밀어 본다 — 근거 열이 잘리면 무엇을 승인하는지 다 볼 수 없다. */
    #detail table { display:block; max-width:100%; overflow-x:auto; }
    th, td { white-space:nowrap; }
  }
</style>
</head>
<body>
<div id="exposure"></div>
<header>
  <h1>시나리오 확인</h1>
  <p>확인해야 토큰이 나오고, 토큰이 있어야 실행됩니다. 이 결과는 설정 간 비교이며 운영 예측이 아닙니다.</p>
</header>
<main>
  <nav id="list"><p class="empty">불러오는 중…</p></nav>
  <section id="detail"><p class="empty">왼쪽에서 시나리오를 고르십시오.</p></section>
</main>
<script>
const $list = document.getElementById('list');
const $detail = document.getElementById('detail');
let current = null;

// 목록은 괄호를 살려 낸다. String([[660],[660,1380]]) 은 "660,660,1380" 이라 어디서 한 조건이
// 끝나는지 사라진다 — 사람이 무엇을 승인하는지 읽을 수 없으면 확인이 확인이 아니다.
const esc = s => (Array.isArray(s) ? JSON.stringify(s) : String(s))
  .replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function loadList() {
  const body = await (await fetch('/api/scenarios')).json();
  const rows = body.scenarios;

  // 이 서버에는 인증이 없다. 루프백 바인딩이 풀린 것을 조용히 넘기면, 확인하는 사람은
  // 자기 화면이 같은 네트워크의 누구에게나 열려 있다는 사실을 모른 채 동의한다.
  const $exp = document.getElementById('exposure');
  if (!body.loopbackOnly) {
    $exp.className = 'on';
    $exp.textContent = `이 화면이 ${body.boundAddress} 로 열려 있습니다. `
      + '인증이 없으므로 같은 네트워크의 누구나 이 시나리오를 확인해 줄 수 있습니다.';
  } else {
    $exp.className = '';
  }

  if (!rows.length) {
    $list.innerHTML = '<p class="empty">보관된 시나리오가 없습니다.<br>build_scenario 를 먼저 부르십시오.</p>';
    return;
  }
  $list.innerHTML = rows.map(r => `
    <button data-id="${esc(r.scenarioId)}" aria-current="${r.scenarioId === current}">
      <code>${esc(r.scenarioId)}</code><br>
      <span class="state ${r.state}">${r.state}</span>
      · ${r.runCount}벌${r.unapprovedCount
          ? (r.state === 'UNCONFIRMED' ? ` · 미승인 ${r.unapprovedCount}` : ` · 기본값 ${r.unapprovedCount}`)
          : ''}
    </button>`).join('');
  $list.querySelectorAll('button').forEach(b =>
    b.onclick = () => loadDetail(b.dataset.id));
}

// 실행마다 달라지는 필드가 곧 실험 변수다 — 서버가 따로 알려줄 필요가 없다.
function sweptKeys(runs) {
  if (runs.length < 2) return [];
  return Object.keys(runs[0]).filter(k =>
    runs.some(r => JSON.stringify(r[k]) !== JSON.stringify(runs[0][k])));
}

// 출처를 사람이 읽는 말로 — 영문 표기만 보이면 무엇이 내가 말한 값인지 가를 수 없다.
const ORIGIN = { USER: '사용자가 말함', MODEL_DEFAULT: '기본값(사용자가 정하지 않음)', DERIVED: '요청에서 도출' };

async function loadDetail(id) {
  current = id;
  const res = await fetch(`/api/scenarios/${encodeURIComponent(id)}`);
  if (!res.ok) {
    $detail.innerHTML = `<p class="empty">시나리오 <code>${esc(id)}</code> 를 찾지 못했습니다. 서버가 다시 시작되었으면 시나리오를 다시 만들어야 합니다.</p>`;
    return;
  }
  const d = await res.json();
  const unapproved = Object.entries(d.unapprovedDefaults || {});
  // 항목은 이름으로 보이고, 영문 키는 옆에 작게 둔다 — LLM 과 같은 키로 이야기할 수 있게.
  // 템플릿이 아닌, 실행 설정에만 있는 보조 칸의 이름.
  const shown = Object.assign({ collectionTimeLabel: '수거 시각(시:분)' }, d.labels);
  const name = k => shown[k] ? `${esc(shown[k])} <code>${esc(k)}</code>` : esc(k);
  // 실행 설정에는 같은 값이 두 이름으로 들어 있기도 하다(truckCount · numTrucks). 이름과 값이 같은 열은 한 번만 보인다.
  const seen = new Set();
  const swept = sweptKeys(d.runs).filter(k => {
    const sig = (shown[k] ?? k) + JSON.stringify(d.runs.map(r => r[k]));
    return !seen.has(sig) && seen.add(sig);
  });
  $list.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));

  $detail.innerHTML = `
    <h2 style="font-size:16px;margin:0 0 6px">
      <code>${esc(d.scenarioId)}</code> <span class="state ${d.state}">${d.state}</span>
    </h2>
    <p style="color:#666;font-size:13px;margin:0 0 14px">
      SES ${esc(d.sesId)} ${esc(d.sesVersion)} · 실행 설정 ${d.runs.length}벌
    </p>

    <div class="ask"><strong>LLM 이 전달한 사용자 요청</strong>
      <p>${d.request ? esc(d.request) : '<span style="color:#666">요청 원문이 함께 전달되지 않았습니다.</span>'}</p></div>

    ${d.runs[0]?.parkingSnapshot ? `<div class="warn"><strong>공공데이터 API 초기 상태</strong>
      <p>조회 시각: ${esc(d.runs[0].parkingSnapshot.fetchedAt)} (UTC). 실제 관측 시각은 제공되지 않습니다.
      조회 상태를 고정하여 비교하며 실행 중 API로 덮어쓰지 않습니다.</p>
      <p>출처: ${esc(d.runs[0].parkingSnapshot.source)}</p>
      <table><tr><th>주차장 / 관리번호</th><th>주소</th><th>시설면수</th><th>적용 총면수</th><th>잔여면수</th></tr>
      ${d.runs[0].parkingSnapshot.lots.map(l => `<tr><td>${esc(l.name)}<br>${esc(l.id)}</td><td>${esc(l.address)}</td><td>${esc(l.facilitySpaces)}</td><td>${esc(l.totalSpaces)}</td><td>${esc(l.availableSpaces)}</td></tr>`).join('')}</table>
      <p>총면수가 다르면 실시간 응답의 총면수를 적용합니다. 기존 차량은 모두 ${esc(d.runs[0].initialVehicleRemainingMinutes)}분 후 출차한다고 가정합니다.
      시작 시간대는 조회 시각의 한국 시간입니다. 요금·운영시간·실제 도로망은 API에서 적용하지 않습니다.
      아래 실험 요금을 사용하며 주차장은 24시간 이용 가능한 것으로 가정합니다. 선택한 주차장이 노외 주차장인지 확인하십시오.</p></div>` : ''}

    ${unapproved.length ? (d.state === 'UNCONFIRMED'
      ? `<div class="warn"><strong>사용자가 승인하지 않은 기본값 ${unapproved.length}개</strong>
      <table><tr><th>항목</th><th>값</th></tr>
      ${unapproved.map(([k, v]) => `<tr><td>${name(k)}</td><td>${esc(v)}</td></tr>`).join('')}
      </table>확인하면 이 값으로 돌아갑니다.</div>`
      // 확인은 시나리오 전체를 승인한다. 값의 출처(MODEL_DEFAULT)는 기록이라 바꾸지 않지만,
      // 확인한 뒤에도 "승인하지 않은" 이라고 쓰면 사람이 누른 확인이 없던 일처럼 읽힌다.
      : `<div class="approved"><strong>확인 때 함께 승인된 기본값 ${unapproved.length}개</strong>
      <table><tr><th>항목</th><th>값</th></tr>
      ${unapproved.map(([k, v]) => `<tr><td>${name(k)}</td><td>${esc(v)}</td></tr>`).join('')}
      </table>사용자가 말하지 않은 값이지만, 확인 화면에서 이 값으로 승인했습니다.</div>`) : ''}

    ${d.blocks.length ? `<div class="warn"><strong>막힌 사유</strong><ul>
      ${d.blocks.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}

    <h3 style="font-size:14px;margin:16px 0 0">모든 항목과 정한 근거</h3>
    <table><tr><th>항목</th><th>값</th><th>정한 근거</th></tr>
    ${Object.entries(d.values).map(([k, v]) =>
      `<tr><td>${name(k)}</td><td>${esc(v)}</td><td>${esc(ORIGIN[d.origins[k]] ?? d.origins[k] ?? '')}</td></tr>`).join('')}
    </table>

    <h3 style="font-size:14px;margin:0 0 0">조건마다 달라지는 것</h3>
    ${swept.length ? `<div class="scroll"><table><tr>${swept.map(k => `<th>${name(k)}</th>`).join('')}</tr>
      ${d.runs.map(r => `<tr>${swept.map(k => `<td>${typeof r[k] === 'boolean' ? (r[k] ? '적용' : '적용 안 함') : esc(r[k])}</td>`).join('')}</tr>`).join('')}
      </table></div>` : '<p style="color:#666">설정 한 벌뿐입니다.</p>'}

    <button class="go" ${d.state !== 'CONFIRMED' && !d.blocks.length ? '' : 'disabled'}>
      ${{ UNCONFIRMED: '이 설정으로 돌린다', EXECUTED: '다시 확인하고 돌린다' }[d.state] ?? '이미 확인됨'}
    </button>
    ${d.confirmToken ? `<p style="color:#666;font-size:13px">확인 토큰
      <code>${esc(d.confirmToken)}</code> · 이 토큰으로만 실행됩니다.
      설정이 바뀌면 무효가 됩니다.</p>` : ''}
    <p id="out" style="color:#666;font-size:13px"></p>`;

  const $go = $detail.querySelector('button.go');
  if ($go && !$go.disabled) $go.onclick = () => confirmIt(id);
}

async function confirmIt(id) {
  const res = await fetch(`/api/scenarios/${encodeURIComponent(id)}/confirm`, { method: 'POST' });
  const body = await res.json();
  if (!res.ok) {
    document.getElementById('out').textContent = '확인하지 못했습니다: ' + JSON.stringify(body);
    return;
  }
  await loadList();
  await loadDetail(id);
}

// LLM 이 안내한 주소(?id=...)로 들어오면 그 시나리오를 바로 연다.
const wanted = new URLSearchParams(location.search).get('id');
loadList().then(() => { if (wanted) loadDetail(wanted); });
</script>
</body>
</html>

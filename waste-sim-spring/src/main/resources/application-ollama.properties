# LLM 백엔드: 로컬 Ollama — 모델이 설치된 윈도우 1대에서 벤치마크·테스트용.
# 비밀값 없음(git 커밋 안전). Ollama는 인증을 검사하지 않으므로 키는 더미다.
#
# 활성화: SPRING_PROFILES_ACTIVE=ollama
# 모델만 바꿔 벤치마크하려면 파일 수정 없이 환경변수로:
#   OPENAI_MODEL=gemma2:9b mvn spring-boot:run
#
# gemma2:9b 선택 근거(llm_benchmark.py 실측): JSON 추출 오탐 0/12, Jailbreak
# 방어율 100%로 4모델 중 가장 안정적. 기본값은 기존 설정대로 qwen2.5:7b 유지.
openai.api.url=${OPENAI_API_URL:http://localhost:11434/v1/chat/completions}
openai.model=${OPENAI_MODEL:qwen2.5:7b}
openai.api.key=${OPENAI_API_KEY:ollama}

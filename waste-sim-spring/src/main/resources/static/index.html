<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>시뮬레이션 허브</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!--
  이 서버는 장량동 하나만 다루므로 화면도 하나다 — 루트(/)가 이 문서를 돌려준다.

  사이드바는 아래 <template>에서 #sidebar에 마운트한다. 라즈베리파이 엣지 도메인이
  함께 있던 시절에는 도메인마다 <template>을 두고 골라 끼웠고, 그래서 비활성 도메인의
  마크업이 DOM에 남지 않아 id 충돌이 생기지 않았다. 도메인이 하나가 된 지금도 구조는
  그대로 두었다 — 사이드바 마크업을 본문과 분리해 두는 것 자체가 이득이다.
-->

<!-- ── 사이드바 (도메인별로 교체됨) ──────────────────────────────── -->
<aside class="sidebar" id="sidebar"></aside>

<!-- ── 채팅 영역 (모든 도메인 공통) ──────────────────────────────── -->
<main class="chat-wrap">
  <div class="chat-header">
    <div class="status-dot" id="statusDot"></div>
    <div class="title">AI 시뮬레이션 어시스턴트</div>
    <div class="subtitle" id="connStatus">연결 중...</div>
    <button class="btn btn-secondary" style="width:auto;padding:5px 12px;font-size:12px"
            onclick="clearChat()">대화 초기화</button>
  </div>

  <div class="messages" id="messages">
  </div>

  <div class="input-area">
    <textarea id="msgInput" rows="1"
              placeholder="어떤 실험을 하고 싶은지 한 문장으로 적어 주세요..."
              onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="send()" disabled>➤</button>
  </div>
</main>

<!-- ── 사이드바 템플릿: 장량동 생활쓰레기 ───────────────────────── -->
<template id="tpl-sidebar-waste">
  <h1>쓰레기 시뮬레이터</h1>
  <p style="font-size:11px;color:var(--muted);line-height:1.5">
    포항 장량동 원룸촌 생활쓰레기 DEVS 시뮬레이션<br>
    채팅으로 조건을 자연어로 입력하세요.<br>
    "시뮬레이터 만들어 줘"라고 하면 필요한 값을<br>
    순서대로 여쭤봅니다.
  </p>

  <div class="divider"></div>

  <!-- 결과 패널 -->
  <div class="result-panel" id="resultPanel">
    <h3>최근 결과</h3>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="val" id="statMean">—</div>
        <div class="lbl">평균 생활 민원</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statStd">—</div>
        <div class="lbl">표준편차</div>
      </div>
    </div>
    <canvas id="sideChart"></canvas>
  </div>
</template>

<!--
  로드 순서가 중요하다.
  domain.js(레지스트리) → 각 도메인 모듈(자기 자신을 등록) → chat.js(마지막에 부팅).
  chat.js가 마지막이어야 Domains.boot() 시점에 모든 도메인이 등록을 마친 상태다.
-->
<script src="/js/domain.js"></script>
<script src="/js/waste.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>

# LLM 백엔드: OpenAI (GPT API) — 윈도우 1대 + 맥북에서 사용.
# 비밀값 없음(git 커밋 안전). 키는 OPENAI_API_KEY 환경변수로만 주입한다.
#
# 활성화: SPRING_PROFILES_ACTIVE=openai (기본값이라 미설정 시에도 이 프로파일)
#
# Gemini 등 다른 OpenAI 호환 엔드포인트로 임시 전환하려면 환경변수로 덮어쓴다:
#   OPENAI_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

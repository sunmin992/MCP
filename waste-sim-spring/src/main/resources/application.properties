spring.application.name=waste-sim-spring
server.port=8080

# LLM 엔드포인트 (OpenAI 호환). 기본값은 로컬 Ollama, 환경변수로 덮어쓸 수 있음.
#   - Ollama(기본): http://localhost:11434/v1/chat/completions, 키 불필요(더미)
#   - OpenAI로 바꾸려면:
#       OPENAI_API_URL=https://api.openai.com/v1/chat/completions
#       OPENAI_MODEL=gpt-4o-mini   OPENAI_API_KEY=sk-...
#   - Gemini로 바꾸려면 (OpenAI 호환 엔드포인트, https://aistudio.google.com/apikey 에서 키 발급):
#       OPENAI_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
#       OPENAI_MODEL=gemini-2.0-flash   OPENAI_API_KEY=<발급받은 키>
openai.api.key=${OPENAI_API_KEY:ollama}
openai.api.url=${OPENAI_API_URL:http://localhost:11434/v1/chat/completions}
openai.model=${OPENAI_MODEL:qwen2.5:7b}

# 로그 레벨
logging.level.com.wastesim=DEBUG
logging.level.org.springframework.web.socket=INFO

# 로그에 correlation id 표시 (CorrelationIdFilter가 MDC requestId 주입)
logging.pattern.level=%5p [%X{requestId:-}]

# 관측성 — Actuator 엔드포인트 노출 (/actuator/health, /actuator/metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

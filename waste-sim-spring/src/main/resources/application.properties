spring.application.name=waste-sim-spring
server.port=8090

# LLM 엔드포인트 (OpenAI 호환). 기본값은 로컬 Ollama, 환경변수로 덮어쓸 수 있음.
#   - Ollama(기본): http://localhost:11434/v1/chat/completions, 키 불필요(더미)
#   - OpenAI로 바꾸려면:
#       OPENAI_API_URL=https://api.openai.com/v1/chat/completions
#       OPENAI_API_KEY=sk-...
#   - Gemini로 바꾸려면 (OpenAI 호환 엔드포인트, https://aistudio.google.com/apikey 에서 키 발급):
#       OPENAI_API_URL=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
#       OPENAI_API_KEY=<발급받은 키>
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:http://localhost:11434/v1/chat/completions}

# 사용 모델 — 단일 모델로 추출/답변 모두 처리한다(mixed 라우팅 제외).
# 의도분류(1단계)는 ExecutionIntentDetector(정규식)로 결정론적 처리하므로
# LLM을 쓰지 않는다 — 로컬 모델이 온도 0에서도 완전히 결정론적이지 않아
# 조건절이 겹친 문장을 반복 오분류하는 문제가 있었다(C2 원칙 확장 적용).
# qwen2.5:7b 선택 근거(llm_benchmark.py 실측): 파이프라인 인식 100%/오탐 0%,
# 사실성(할루시네이션 없음) 100%, Jailbreak 방어율 100%로 gemma2:9b와
# 안전성·정확도는 동률이나, 파이프라인 응답 속도가 더 빠름(1.6~1.9s vs 2.4s).
openai.model=${OPENAI_MODEL:qwen2.5:7b}

# 원본 논문 재현 Python/pyevsim DEVS 엔진(waste_sim) 연결 — PythonWasteSimAdapter가
# `<executable> -m waste_sim.mcp_bridge`를 project-root에서 서브프로세스로
# 실행한다(MCP_모델_연결_방법.md). project-root는 waste_sim 패키지의 "상위"
# 폴더(adev-master)여야 한다 — 다른 환경에서는 WASTE_SIM_PYTHON_PROJECT_ROOT로
# 반드시 재설정할 것.
waste-sim.python.executable=${WASTE_SIM_PYTHON_EXECUTABLE:python}
waste-sim.python.project-root=${WASTE_SIM_PYTHON_PROJECT_ROOT:C:\\Dev\\project\\python-project\\adev-master}
# 순수 Python DEVS 엔진(pyevsim)은 Java 재구현 엔진보다 훨씬 느리다 — 채팅
# 기본값(30일×30시드)을 실측하니 약 87초 걸렸다(예전 기본값 30초는 항상
# 타임아웃 나는 수준이라 실사용 불가 — 라이브 테스트로 재현된 버그, 여유를
# 넉넉히 둬서 180초로 올림).
waste-sim.python.timeout-seconds=${WASTE_SIM_PYTHON_TIMEOUT_SECONDS:180}


# 로그 레벨
logging.level.com.wastesim=DEBUG
logging.level.org.springframework.web.socket=INFO

# 로그에 correlation id 표시 (CorrelationIdFilter가 MDC requestId 주입)
logging.pattern.level=%5p [%X{requestId:-}]

# 관측성 — Actuator 엔드포인트 노출 (/actuator/health, /actuator/metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

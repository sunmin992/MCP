spring.application.name=waste-sim-spring
server.port=8090
# 루프백에만 바인딩한다 — 이 서버는 인증이 없어서(Spring Security 미사용) /mcp·/ws·
# /actuator가 전부 무방비로 열려 있다. 0.0.0.0에 바인딩하면 같은 네트워크의 누구나
# MCP tools/call로 파이썬 서브프로세스를 띄울 수 있고, 채팅 세션이 하나로 공유되므로
# (D-05, ChatController의 sessionId="default") 남의 대화까지 그대로 들여다본다.
# 연구용 로컬 도구라 외부에서 접근할 이유가 없다.
# 다른 기기에서 붙어야 하면 이 줄을 지우지 말고 SERVER_ADDRESS 환경변수로 덮어쓸 것.
server.address=${SERVER_ADDRESS:127.0.0.1}

# LLM 백엔드는 Spring 프로파일로 고른다 — 머신마다 이 파일을 고치지 말 것.
#   - openai (기본): application-openai.properties, 키는 OPENAI_API_KEY 환경변수
#   - ollama       : application-ollama.properties, 로컬 모델(키 불필요)
# 머신별로 SPRING_PROFILES_ACTIVE 환경변수를 한 번만 걸어두면 실행 명령이 같아진다.
# 일회성으로 바꾸려면: mvn spring-boot:run -Dspring-boot.run.profiles=ollama
spring.profiles.default=openai

# API 키는 어떤 경우에도 파일에 적지 않는다(환경변수 전용, git에 남지 않음).
openai.api.key=${OPENAI_API_KEY:}

# 사용 모델 — 단일 모델로 추출/답변 모두 처리한다(mixed 라우팅 제외).
# 의도분류(1단계)는 ExecutionIntentDetector(정규식)로 결정론적 처리하므로
# LLM을 쓰지 않는다 — 로컬 모델이 온도 0에서도 완전히 결정론적이지 않아
# 조건절이 겹친 문장을 반복 오분류하는 문제가 있었다(C2 원칙 확장 적용).
# 구체적인 url·model 값은 위 프로파일 파일에 있다.

# 원본 논문 재현 Python/pyevsim DEVS 엔진(waste_sim) 연결 — PythonWasteSimAdapter가
# `<executable> -m waste_sim.mcp_bridge`를 project-root에서 서브프로세스로
# 실행한다(MCP_모델_연결_방법.md). project-root는 waste_sim 패키지의 "상위"
# 폴더(adev-master)여야 한다 — 다른 환경에서는 WASTE_SIM_PYTHON_PROJECT_ROOT로
# 반드시 재설정할 것.
waste-sim.python.executable=${WASTE_SIM_PYTHON_EXECUTABLE:python}
waste-sim.python.project-root=${WASTE_SIM_PYTHON_PROJECT_ROOT:C:\\Dev\\project\\python-project\\adev-master}
# 순수 Python DEVS 엔진(pyevsim)은 Java 재구현 엔진보다 훨씬 느리다 — 채팅
# 기본값(30일×30시드)을 실측하니 약 87초 걸렸다(예전 기본값 30초는 항상
# 타임아웃 나는 수준이라 실사용 불가 — 라이브 테스트로 재현된 버그, 여유를
# 넉넉히 둬서 180초로 올림).
waste-sim.python.timeout-seconds=${WASTE_SIM_PYTHON_TIMEOUT_SECONDS:180}


# 로그 레벨
logging.level.com.wastesim=DEBUG
logging.level.org.springframework.web.socket=INFO

# 로그에 correlation id 표시 (CorrelationIdFilter가 MDC requestId 주입)
logging.pattern.level=%5p [%X{requestId:-}]

# 관측성 — Actuator 엔드포인트 노출 (/actuator/health, /actuator/metrics)
management.endpoints.web.exposure.include=health,info,metrics
# show-details=always는 인증 없이 디스크 경로·여유 공간·컴포넌트 상태를 그대로 내보낸다.
# 이 서버에는 Spring Security가 없어 /actuator/health를 부르는 누구나 그 값을 본다.
# 상태(UP/DOWN)만 알면 되는 용도라 상세는 끈다 — 디버깅이 필요하면 환경변수로 한 번만 켠다.
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

# 정적 리소스 캐시 비활성 — 프론트엔드(js/css)를 고치고 새로고침해도 브라우저가 예전
# 파일을 그대로 쓰는 문제를 막는다. Cache-Control 없이 Last-Modified만 나가면 브라우저가
# 휴리스틱 캐시를 적용해서, 서버는 새 파일을 주는데 화면만 옛날 동작을 한다(실제로 겪음).
# 로컬에서 돌리는 연구용 도구라 캐시 이득보다 "고친 게 바로 보이는 것"이 중요하다.
spring.web.resources.cache.period=0

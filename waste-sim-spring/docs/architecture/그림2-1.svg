<text x="24" y="40" font-size="21" font-weight="700" fill="#181818">그림 2-1. 진행 과정 — 확인 흐름 반영판</text>
<text x="24" y="66" font-size="13" fill="#666">주황색 네 줄이 그림 2와 달라진 곳이다. 12단계만 LLM을 거치지 않는다 — 거치면 모델이 스스로 동의를 만들어낼 수 있다.</text>

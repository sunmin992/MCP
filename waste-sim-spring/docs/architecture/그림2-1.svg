<text x="24" y="942" font-size="12" fill="#666">쓰기(확인·토큰 발급): 사람 → /confirm.html          읽기(상태·토큰): LLM → get_scenario_status          실행: 토큰이 맞을 때만 run_scenario_by_token</text>
<text x="24" y="964" font-size="12" fill="#666">2·3·4단계(요청 프로필·조회·매칭)는 계획 2에서 채운다. 후보가 장량동 하나뿐인 동안은 4단계를 평가할 수 없다.</text>

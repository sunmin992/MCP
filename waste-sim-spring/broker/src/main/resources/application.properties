spring.application.name=waste-sim-broker
# 브로커 MCP 서버. 시뮬레이터(8090)는 뜰 때 이 주소로 자기 능력 카드를 등록한다
# (시뮬레이터 쪽 broker.url).
server.port=8089
# 시뮬레이터와 같은 이유로 루프백에만 바인딩한다 — 인증이 없어 /api/simulators 로 누구나
# 카드를 등록할 수 있다. 다른 기기에서 붙어야 하면 SERVER_ADDRESS 로 덮어쓴다.
server.address=${SERVER_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,info

# 호출마다 요청 id 를 붙인다(BrokerMcpController 가 MDC requestId 를 넣는다) — 시뮬레이터와 같은 모양.
logging.pattern.level=%5p [%X{requestId:-}]

# 터미널과 함께 파일에도 남긴다. VS Code 작업 터미널에 찍힌 로그는 다른 세션(채팅 세션 · 점검하는
# 세션)이 읽을 수 없어, 흐름을 되짚으려면 사람이 복사해 붙여야 했다. 경로는 작업 폴더 기준이라
# spring-boot:run 이면 모듈 폴더 아래에 생긴다. *.log · logs/ 는 .gitignore 에 걸려 있다.
logging.file.name=logs/broker.log

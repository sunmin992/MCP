spring.application.name=pohang-counter-sim
server.port=8093
# 인증이 없는 서버다. 확인 화면이 같은 네트워크에 열리지 않게 루프백에만 묶는다.
server.address=127.0.0.1

# 브로커 등록 — 기동 시 능력 카드를 보내고, 꺼질 때 해제한다.
broker.url=${BROKER_URL:http://127.0.0.1:8089}
broker.registration.enabled=${BROKER_REGISTRATION_ENABLED:true}
broker.registration.interval-seconds=30

spring.jackson.serialization.indent-output=false
logging.level.mcp.calls=INFO
